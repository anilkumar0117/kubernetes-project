name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Get AWS account ID
      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:$GITHUB_SHA \
            ./app

      # 6. Tag image
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:$GITHUB_SHA \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA

      # 7. Push image to ECR
      - name: Push image to ECR
        run: |
          docker push \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA

      # 8. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # 9. Update Kubernetes image
      - name: Update deployment image
        run: |
          sed -i \
            "s|IMAGE_PLACEHOLDER|$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA|g" \
            "k8's/deployment.yaml"

      # 10. Deploy Kubernetes manifests
      - name: Deploy to EKS
        run: |
          kubectl apply -f "k8's/deployment.yaml"
          kubectl apply -f "k8's/service.yaml"
          kubectl apply -f "k8's/ingress.yaml"

      # 11. Verify deployment
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/my-app --timeout=180s
          kubectl get pods -o wide
          kubectl get svc
          kubectl get ingress
