name: Kubernetes Deployment

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: anil-docker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./app
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name my-cluster

      - name: Update Kubernetes Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: anil-docker
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$REGISTRY/$REPOSITORY:$IMAGE_TAG|g" "k8's/deployment.yaml"

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f "k8's/deployment.yaml"
          kubectl apply -f "k8's/service.yaml"
          kubectl apply -f "k8's/ingress.yaml"

      - name: Check Deployment
        run: |
          kubectl rollout status deployment/my-app --timeout=180s
          kubectl get pods
          kubectl get svc
          kubectl get ingress
